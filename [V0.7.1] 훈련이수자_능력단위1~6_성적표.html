function render(i){const s=students[i];const rows=s.units.slice(0,6).map(u=>{const st=status(u.final);return `<tr><td>${esc(u.no)} ${esc(u.name)}</td><td>${fmt(u.diag)}</td><td class="${st[1]}">${fmt(u.final)}</td><td>${fmt(u.self)}</td><td class="${st[1]}">${st[0]}</td></tr>`}).join('');const fbs=s.feedback||{};const fbRows=names.map(u=>{const f=fbs[u.no];return `<article class="feedback"><div class="feedback-title"><span>${esc(u.no)} ${esc(u.name)}</span><span class="feedback-meta">${f?`본평가 ${fmt(f.score)} · ${esc(f.result)} · ${esc(f.level)} · ${esc(f.date)}`:'교수자 의견 미확인'}</span></div><div class="feedback-text ${f?'':'empty'}">${esc(f?f.opinion:'원천 DB에서 교수자 평가의견을 확인하지 못했습니다.')}</div></article>`}).join('');document.querySelector('#app').innerHTML=`<section class="sheet page1"><div class="sheet-head"><div><h1>${esc(s.name)} · 개인 성장 성적표</h1><p>${esc(s.status)} · 능력단위 ①~⑥ 평가결과 · 담당교수자 이혁주</p></div><div class="status">${esc(s.status)}</div></div><div class="metrics"><div class="metric att"><span>출석률</span><strong>${fmt(s.att)}%</strong><span class="sub">훈련일수 ${fmt(s.days)}일 · 출석일수 ${fmt(s.present)}일</span><em>2026-09-09 기준 · 일수 기준</em></div><div class="metric"><span>사전평가</span><strong>${fmt(s.pre)}</strong><em>원점수</em></div><div class="metric"><span>사전진단 평균</span><strong>${fmt(s.diag_avg)}</strong><em>100점 환산</em></div><div class="metric"><span>본(재)평가 평균</span><strong>${fmt(s.final_avg)}</strong><em>PASS/FAIL 판정 기준</em></div><div class="metric"><span>SELF CHECK 이론점검 평균</span><strong>${fmt(s.self_avg)}</strong><em>100점 환산</em></div></div><section class="section"><h2>능력단위별 평가 결과</h2><div class="legend"><span>셀 배경색:</span><b class="p">PASS · 본(재)평가 60점 이상</b><b class="f">FAIL · 본(재)평가 60점 미만</b><b class="m">미실시</b></div><div class="table-wrap"><table class="table"><thead><tr><th>능력단위</th><th>사전진단<br>(100점 환산)</th><th>본(재)평가<br>판정점수</th><th>SELF CHECK 이론점검<br>(100점 환산)</th><th>판정</th></tr></thead><tbody>${rows}</tbody></table></div><div class="note">※ PASS/FAIL은 본(재)평가 점수만으로 결정합니다. 사전진단·SELF CHECK 이론점검 점수는 학습상태를 확인하기 위한 참고자료입니다.</div></section><div class="footer">※ 과정 종료 전 최종종합은 산정·표시하지 않습니다. 데이터 출처: 훈련생 성장·피드백 DB V0.6 현시점 확정본.</div></section><section class="sheet page2"><div class="p2-head"><small>개인 성적표 · 2페이지 · 교수자 의견 원문</small><h2>${esc(s.name)} 교수자 평가의견 및 후속 참고</h2><span>능력단위 ①~⑥ · 원천 DB의 교수자 피드백 상세 시트 반영</span></div><div class="feedback-grid">${fbRows}</div><div class="p2-foot">※ 교수자 의견은 원문을 기준으로 표시합니다. AI가 평가의견을 새로 작성하거나 보완하지 않았습니다.</div></section>`}
const select=document.querySelector('#student');students.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.name;select.appendChild(o)});select.addEventListener('change',e=>render(Number(e.target.value)));document.querySelector('#print').addEventListener('click',()=>window.print());render(0);
</script></body></html>
